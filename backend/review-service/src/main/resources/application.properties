spring.application.name=review-service

# ===============================
# Server
# ===============================
server.port=${REVIEW_SERVICE_PORT:8082}

# ===============================
# JSON Review Storage
# ===============================
review.storage.file=${REVIEW_STORAGE_FILE:reviews.json}

# ===============================
# Prompt Service Communication
# ===============================
prompt.service.url=${PROMPT_SERVICE_URL:http://localhost:8081}

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:dummy-jwt-secret-for-local-dev-1234567890}

# ===============================
# Scheduled Digest
# ===============================
digest.interval-ms=${DIGEST_INTERVAL_MS:30000}
digest.initial-delay-ms=${DIGEST_INITIAL_DELAY_MS:5000}

# ===============================
# Async Notification
# ===============================
notification.log.file=${NOTIFICATION_LOG_FILE:notifications.log}
notification.delay-ms=${NOTIFICATION_DELAY_MS:3000}